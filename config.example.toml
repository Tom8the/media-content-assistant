[ffmpeg]
ffmpeg_path = "ffmpeg"
ffprobe_path = "ffprobe"

[asr]
engine = "faster-whisper"
model_path = "models/faster-whisper-small"
# 留空即由 Whisper 自动识别语言；适合阿拉伯语、英语或两者混说的视频。
# language = "ar"
device = "cpu"
compute_type = "int8"
cpu_threads = 4
beam_size = 5
vad_filter = true
word_timestamps = true
condition_on_previous_text = false

[alignment]
time_weight = 0.55
text_weight = 0.35
confidence_weight = 0.10
match_threshold = 0.55
review_threshold = 0.72
include_unmatched_hard_subtitles = false

[ocr]
enabled = false
engine = "paddleocr"
language = "ch"
device = "cpu"
detection_model_name = "PP-OCRv5_mobile_det"
recognition_model_name = "PP-OCRv5_mobile_rec"
sample_interval = 1.2
crop_top = 0.78
crop_bottom = 0.94
scale = 1
min_confidence = 0.55
image_change_threshold = 0.12
signature_left = 0.20
signature_right = 0.80
signature_top = 0.15
signature_bottom = 0.92
signature_edge_threshold = 45
text_center_left = 0.10
text_center_right = 0.90
text_center_top = 0.10
text_center_bottom = 0.98
text_min_height_ratio = 0.20
text_min_width_ratio = 0.025
progress_interval_frames = 5

[paths]
work_dir = "work"
output_dir = "output"

[translation]
# NLLB INT8 直译模型目录；首次执行 video2txt install-translation-models 下载。
model_path = "models/nllb-ct2-int8"
device = "cpu"
compute_type = "int8"
inter_threads = 1
intra_threads = 8

[qwen_asr]
# API Key 请仅通过环境变量 DASHSCOPE_API_KEY 设置，勿写入本文件。
model = "qwen-audio-3.0-asr-flash-filetrans"
region = "beijing"
# workspace_id = "your-workspace-id"
api_key_environment = "DASHSCOPE_API_KEY"
poll_interval_seconds = 5
wait_timeout_seconds = 3600
hotword_weight = 3

[codex_translation]
# API 模式由本机已登录的 Codex CLI 翻译；不需要另行配置 API Key。
command = "codex"
# model = ""
timeout_seconds = 900
batch_size = 24
