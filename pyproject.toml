[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "video2txt"
version = "2.0.0"
description = "Media content assistant for video downloads, live recording, transcription and AI summaries"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pydantic>=2.10,<3",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
douyin = ["requests>=2.33.1,<3", "yt-dlp>=2026.8.19", "streamget>=4.0.10,<5"]
api = ["requests>=2.32,<3"]
asr = ["faster-whisper>=1.2,<2"]
subtitles = [
  "opencc-python-reimplemented>=0.1.7,<1",
  "pysubs2>=1.8,<2",
  "rapidfuzz>=3.10,<4",
]
ocr = [
  "paddleocr>=3.3,<4",
  "paddlepaddle>=3.2,<4",
  "pillow>=11,<13",
]
web = [
  "fastapi>=0.116,<1",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]
translation = [
  "ctranslate2>=4.6,<5",
  "huggingface-hub>=0.28,<1",
  "sentencepiece>=0.2,<1",
]

[project.scripts]
video2txt = "video2txt.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/video2txt"]
